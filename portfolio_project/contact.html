<section class="contact">
  <h1><i class="fa-solid fa-envelope"></i> Contact Me</h1>

  <p class="contact-intro">
    Have a project in mind or just want to say hi?  
    Feel free to send me a message ✨
  </p>

  <form id="contact-form">
    <input type="text" id="name" placeholder="Your Name" required>
    <input type="email" id="email" placeholder="Your Email" required>
    <textarea id="message" placeholder="Your Message" required></textarea>
    <button type="submit">Send Message</button>
  </form>

  <p id="form-message"></p>

  <div class="contact-info">
    <p><i class="fa-solid fa-envelope"></i> stephanie@email.com</p>
    <p><i class="fa-solid fa-location-dot"></i> Philippines (GMT+8)</p>
    <p><i class="fa-solid fa-briefcase"></i> Available for freelance & collaborations</p>
  </div>
</section>
